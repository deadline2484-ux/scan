<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="문서스캐너">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>문서 스캐너</title>
<style>
:root{--blue:#0b5fff;--bg:#f2f4f8;--card:#fff;--text:#14181f;--sub:#6b7280;--line:#e3e7ee;--danger:#d92d20;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit}
header{padding:calc(14px + var(--safe-t)) 18px 10px;background:var(--bg)}
header h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--sub);font-size:13px}
main{padding:0 14px 220px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:15px 16px;
  font-weight:700;font-size:17px;background:#e8edf7;color:var(--blue);width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff}
.btn.kakao{background:#fee500;color:#191600}
.btn.danger{background:#fdecea;color:var(--danger)}
.btn:disabled{opacity:.45}
.btn.small{padding:10px 12px;font-size:14px;border-radius:10px;width:auto}
.row{display:flex;gap:10px}
.row>*{flex:1}
.empty{margin:28px 4px;text-align:center}
.empty .big{font-size:56px;margin-bottom:6px}
.empty p{color:var(--sub);line-height:1.55;margin:6px 0 18px}
.stack{display:flex;flex-direction:column;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:6px 0 14px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;background:#dfe3ea}
.card .meta{padding:6px 10px 0;font-size:13px;color:var(--sub)}
.card .acts{display:flex;gap:4px;padding:6px}
.card .acts button{flex:1;border:0;border-radius:8px;padding:9px 0;background:#eef1f6;font-size:14px}
.card .acts button.del{color:var(--danger)}
.panel{background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel label{display:block;font-size:13px;color:var(--sub);margin:6px 0 4px}
.panel input,.panel select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.tip{background:#fff8e1;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:13.5px;line-height:1.55;color:#5c4a00}
.tip button{margin-top:6px;border:0;background:transparent;color:#8a6d00;font-weight:700;padding:4px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);
  padding:10px 14px calc(10px + var(--safe-b));border-top:1px solid var(--line);z-index:5}
.bar .info{font-size:13px;color:var(--sub);text-align:center;margin-bottom:8px}
.bar .stack{gap:8px}
#editor{position:fixed;inset:0;background:#111;z-index:20;display:none;flex-direction:column}
#editor.on{display:flex}
.etop{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:calc(8px + var(--safe-t)) 10px 8px}
.etop b{font-size:16px}
.etop button{border:0;background:transparent;color:#fff;font-size:17px;padding:8px 10px}
.etop .ok{color:#7fb0ff;font-weight:800}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#cv{touch-action:none;display:block}
.etool{padding:8px 10px calc(10px + var(--safe-b));display:flex;flex-direction:column;gap:8px;color:#fff}
.etool .hint{font-size:12.5px;text-align:center;color:#b8bec9}
.chips{display:flex;gap:8px;justify-content:center}
.chip{border:1px solid #4b5563;background:transparent;color:#e5e7eb;border-radius:999px;padding:9px 16px;font-size:15px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
#fixes .chip,#ratios .chip{font-size:13.5px;padding:7px 12px}
.tools{display:flex;gap:8px;justify-content:center}
.tools button{border:0;border-radius:10px;background:#2a2f38;color:#fff;padding:10px 14px;font-size:15px}
#done{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none;align-items:flex-end}
#done.on{display:flex}
#done .sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:22px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:10px;text-align:center}
#done .big{font-size:44px}
#done b{font-size:19px}
#done p{margin:0 0 6px;color:var(--sub);font-size:14px}
#scan{position:fixed;inset:0;background:#000;z-index:15;display:none;flex-direction:column;color:#fff}
#scan.on{display:flex}
.stop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + var(--safe-t)) 10px 8px}
.stop button{border:0;background:transparent;color:#fff;font-size:16px;padding:8px 10px}
.stop .tog{border:1px solid #6b7280;border-radius:999px;font-size:13.5px;padding:7px 12px}
.stop .tog.on{background:#16a34a;border-color:#16a34a}
#sMsg{font-size:14.5px;font-weight:700;text-align:center;flex:1}
#sStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#sWrap{position:relative}
#vid{display:block;width:100%;height:100%;object-fit:fill;background:#111}
#sOv{position:absolute;inset:0;width:100%;height:100%}
#sFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.sbot{display:flex;align-items:center;justify-content:space-between;padding:12px 22px calc(14px + var(--safe-b))}
#sThumb{width:58px;height:58px;border-radius:10px;border:2px solid #fff;background:#222 center/cover;position:relative;padding:0;visibility:hidden}
#sCount{position:absolute;right:-8px;top:-8px;background:var(--blue);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:13px;line-height:22px;font-weight:700}
#sShot{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0;position:relative}
#sShot::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}
#sShot:active::after{background:#cbd5e1}
#sDone{border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;padding:12px 16px;min-width:58px}
.card img{cursor:pointer}
.sub3{display:flex;gap:8px}
.sub3>*{flex:1}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:center;justify-content:center;color:#fff;flex-direction:column;gap:12px}
#busy.on{display:flex}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 0.9s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(150px + var(--safe-b));transform:translateX(-50%);background:rgba(20,24,31,.92);color:#fff;
  padding:11px 16px;border-radius:12px;font-size:14px;z-index:60;display:none;max-width:88%;text-align:center}
</style>
</head>
<body>
<header>
  <h1>📄 문서 스캐너</h1>
  <p>거래명세서·영수증을 찍어서 PDF로 만들어 카카오톡으로 보내세요</p>
</header>

<main>
  <div id="installTip" class="tip" style="display:none">
    💡 <b>앱처럼 쓰려면</b> 사파리 아래의 <b>공유 버튼(□↑)</b> → <b>홈 화면에 추가</b>를 눌러 주세요.
    <br><button id="tipClose">닫기</button>
  </div>

  <section id="emptyBox" class="empty">
    <div class="big">🧾</div>
    <p>문서를 책상 위에 놓고 위에서 찍어 주세요.<br>문서를 비추면 자동으로 찾아서 찍고, 반듯하게 펴 드립니다.</p>
    <div class="stack">
      <button class="btn primary" id="scanBtn">📷 문서 스캔 시작</button>
      <div class="sub3">
        <button class="btn small" id="camBtn">고화질 촬영</button>
        <button class="btn small" id="libBtn">앨범에서 선택</button>
      </div>
    </div>
  </section>

  <section id="listBox" style="display:none">
    <div id="grid" class="grid"></div>
    <p style="margin:0 2px 10px;font-size:12.5px;color:var(--sub);text-align:center">사진을 누르면 영역·필터를 다시 맞출 수 있어요</p>
    <button class="btn" id="scanBtn2">📷 이어서 스캔</button>
    <div class="sub3" style="margin-top:8px">
      <button class="btn small" id="camBtn2">고화질 촬영</button>
      <button class="btn small" id="libBtn2">앨범에서 추가</button>
    </div>
    <div class="panel">
      <label for="fileName">PDF 파일 이름</label>
      <input id="fileName" type="text" autocomplete="off" autocapitalize="off">
      <label for="pageSize">용지 크기</label>
      <select id="pageSize">
        <option value="a4">A4 (가운데 맞춤)</option>
        <option value="fit">사진 크기 그대로</option>
      </select>
    </div>
  </section>
</main>

<div class="bar" id="bar" style="display:none">
  <div class="info" id="info"></div>
  <div class="stack">
    <button class="btn kakao" id="shareBtn">💬 PDF 만들어 카카오톡으로 보내기</button>
    <div class="row">
      <button class="btn small" id="saveBtn">PDF 저장/열기</button>
      <button class="btn small danger" id="clearBtn">🏠 처음으로</button>
    </div>
  </div>
</div>

<div id="editor">
  <div class="etop">
    <button id="eCancel">취소</button>
    <b>문서 영역 맞추기</b>
    <button id="eOk" class="ok">완료</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="etool">
    <div class="hint">모서리 점이나 변 가운데 점을 끌어 문서 끝에 맞추세요</div>
    <div class="chips" id="chips">
      <button class="chip on" data-f="doc">문서(추천)</button>
      <button class="chip" data-f="bw">흑백</button>
      <button class="chip" data-f="color">원본 색</button>
    </div>
    <div class="chips" id="ratios">
      <button class="chip on" data-r="auto">비율 자동</button>
      <button class="chip" data-r="a4">A4 고정</button>
      <button class="chip" data-r="photo">찍힌 그대로</button>
    </div>
    <div class="chips" id="fixes">
      <button class="chip on" data-k="clean">✓ 검은 테두리 지우기</button>
      <button class="chip on" data-k="straight">✓ 휜 선 곧게</button>
    </div>
    <div class="tools">
      <button id="rotL">↺ 왼쪽 회전</button>
      <button id="auto">🔍 자동 인식</button>
      <button id="rotR">↻ 오른쪽 회전</button>
    </div>
  </div>
</div>

<div id="scan">
  <div class="stop">
    <button id="sClose">✕ 닫기</button>
    <div id="sMsg">문서를 비춰 주세요</div>
    <button id="sAuto" class="tog on">자동 촬영</button>
  </div>
  <div id="sStage"><div id="sWrap"><video id="vid" playsinline muted autoplay></video><canvas id="sOv"></canvas><div id="sFlash"></div></div></div>
  <div class="sbot">
    <button id="sThumb" aria-label="찍은 문서 보기"><span id="sCount">0</span></button>
    <button id="sShot" aria-label="촬영"></button>
    <button id="sDone">완료</button>
  </div>
</div>

<div id="done">
  <div class="sheet">
    <div class="big">✅</div>
    <b id="doneTitle">보냈어요</b>
    <p>다음 문서를 찍을까요? 지금 목록은 비워집니다.</p>
    <button class="btn primary" id="newScan">📷 새 문서 촬영</button>
    <button class="btn" id="goHome">🏠 처음 화면으로</button>
    <button class="btn small" id="stay" style="width:100%;margin-top:2px;background:transparent">그대로 두기 (다시 보내기·수정)</button>
  </div>
</div>
<div id="busy"><div class="spin"></div><div id="busyMsg">처리 중...</div></div>
<div id="toast"></div>

<input type="file" id="camInput" accept="image/*" capture="environment" hidden>
<input type="file" id="libInput" accept="image/*" multiple hidden>

<script src="core.js"></script>
<script src="pdf.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var MAX_SRC = 2600, MAX_OUT = 2200;
  var FILTER_NAMES = { doc: '문서', bw: '흑백', color: '원본 색' };
  var state = { pages: [], filter: 'doc', nextId: 1, fix: { clean: true, straight: true }, ratio: 'auto' };
  var queue = [];           // 앨범에서 여러 장 선택했을 때 순서대로 편집
  var openScan = function () {};   // 아래 '실시간 스캔'에서 정의

  /* ---------- 작은 도구들 ---------- */
  function tick() { return new Promise(function (r) { setTimeout(r, 30); }); }
  function busy(on, msg) { $('#busy').classList.toggle('on', !!on); if (msg) $('#busyMsg').textContent = msg; }
  var toastTimer;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3200);
  }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function pad2(n) { return ('0' + n).slice(-2); }
  function today() { var d = new Date(); return '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }
  function fileBase() {
    var n = ($('#fileName').value || '').replace(/[\\\/:*?"<>|]/g, '_').trim();
    return n || ('문서_' + today());
  }
  function canvasToBytes(canvas, q) {
    return new Promise(function (res, rej) {
      canvas.toBlob(function (b) {
        if (!b) return rej(new Error('이미지 변환 실패'));
        if (b.arrayBuffer) b.arrayBuffer().then(function (ab) { res(new Uint8Array(ab)); });
        else { var fr = new FileReader(); fr.onload = function () { res(new Uint8Array(fr.result)); }; fr.readAsArrayBuffer(b); }
      }, 'image/jpeg', q);
    });
  }
  function imageDataToCanvas(id) {
    var c = document.createElement('canvas'); c.width = id.width; c.height = id.height;
    var x = c.getContext('2d'); x.putImageData(new ImageData(id.data, id.width, id.height), 0, 0);
    return c;
  }
  function bytesToCanvas(bytes) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })), im = new Image();
      im.onload = function () {
        var c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext('2d', { willReadFrequently: true }).drawImage(im, 0, 0); URL.revokeObjectURL(url); res(c);
      };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('저장된 이미지를 읽을 수 없습니다')); };
      im.src = url;
    });
  }
  function loadFileToCanvas(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var s = Math.min(1, MAX_SRC / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * s)); c.height = Math.max(1, Math.round(im.naturalHeight * s));
        c.getContext('2d', { willReadFrequently: true }).drawImage(im, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url); res(c);
      };
      im.onerror = function () { URL.revokeObjectURL(url); rej(new Error('사진을 열 수 없습니다. (지원하지 않는 형식일 수 있어요)')); };
      im.src = url;
    });
  }

  /* ---------- 페이지 목록 화면 ---------- */
  function render() {
    var n = state.pages.length;
    $('#emptyBox').style.display = n ? 'none' : '';
    $('#listBox').style.display = n ? '' : 'none';
    $('#bar').style.display = n ? '' : 'none';
    var g = $('#grid'); g.innerHTML = '';
    var total = 0;
    state.pages.forEach(function (p, i) {
      total += p.out.length;
      var d = document.createElement('div'); d.className = 'card'; d.dataset.i = i;
      d.innerHTML = '<img alt=""><div class="meta"></div><div class="acts">' +
        '<button data-a="l" aria-label="앞으로">◀</button><button data-a="r" aria-label="뒤로">▶</button>' +
        '<button data-a="f">필터</button><button data-a="d" class="del">삭제</button></div>';
      d.querySelector('img').src = p.thumb;
      d.querySelector('.meta').textContent = (i + 1) + '쪽 · ' + FILTER_NAMES[p.filter];
      g.appendChild(d);
    });
    $('#info').textContent = n ? ('총 ' + n + '장 · 약 ' + (total / 1048576).toFixed(1) + 'MB') : '';
  }
  $('#grid').addEventListener('click', function (e) {
    var im = e.target.closest('img');
    if (im) { reEdit(+im.closest('.card').dataset.i); return; }
    var b = e.target.closest('button'); if (!b) return;
    var i = +b.closest('.card').dataset.i, a = b.dataset.a, p = state.pages;
    if (a === 'd') { p.splice(i, 1); render(); }
    else if (a === 'l' && i > 0) { var t = p[i]; p[i] = p[i - 1]; p[i - 1] = t; render(); }
    else if (a === 'r' && i < p.length - 1) { var t2 = p[i]; p[i] = p[i + 1]; p[i + 1] = t2; render(); }
    else if (a === 'f') cycleFilter(p[i]);
  });
  async function cycleFilter(page) {
    var order = ['doc', 'bw', 'color'], f = order[(order.indexOf(page.filter) + 1) % 3];
    busy(true, '필터 적용 중...'); await tick();
    try {
      var c = await bytesToCanvas(page.base);
      var id = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);
      ScanCore.applyFilter(id, f);
      var oc = imageDataToCanvas(id);
      page.out = await canvasToBytes(oc, 0.82); page.thumb = makeThumb(oc); page.filter = f;
    } catch (e) { toast(e.message); }
    busy(false); render();
  }
  async function reEdit(i) {
    var page = state.pages[i]; if (!page || !page.src) return;
    busy(true, '사진 여는 중...'); await tick();
    try { var c = await bytesToCanvas(page.src); busy(false); openEditor(c, i); }
    catch (e) { busy(false); toast(e.message); }
  }
  function makeThumb(canvas) {
    var s = Math.min(1, 360 / Math.max(canvas.width, canvas.height)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(canvas.width * s)); c.height = Math.max(1, Math.round(canvas.height * s));
    c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.75);
  }

  /* ---------- 사진 받기 ---------- */
  function pick(input) { input.value = ''; input.click(); }
  $('#camBtn').onclick = $('#camBtn2').onclick = function () { pick($('#camInput')); };
  $('#scanBtn').onclick = $('#scanBtn2').onclick = function () { openScan(); };
  $('#libBtn').onclick = $('#libBtn2').onclick = function () { pick($('#libInput')); };
  $('#camInput').onchange = $('#libInput').onchange = function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';                      // 같은 사진을 다시 골라도 동작하게
    if (!files.length) return;
    queue = files; nextInQueue();
  };
  async function nextInQueue() {
    if (!queue.length) return;
    var f = queue.shift();
    busy(true, '사진 여는 중...'); await tick();
    try { var c = await loadFileToCanvas(f); busy(false); openEditor(c); }
    catch (err) { busy(false); toast(err.message); nextInQueue(); }
  }

  /* ---------- 편집 화면 (모서리 맞추기) ---------- */
  var cv = $('#cv'), cx = cv.getContext('2d');

  function makePdf() {
    return PdfBuilder.buildPdf(state.pages.map(function (p) { return { jpeg: p.out, w: p.w, h: p.h }; }),
                               { size: $('#pageSize').value, title: fileBase() });
  }
  function download(blob, name) {
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.target = '_blank'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  function showDone(title) { $('#doneTitle').textContent = title; $('#done').classList.add('on'); }
  function resetAll() { state.pages = []; queue = []; scanBadge(); $('#done').classList.remove('on'); render(); window.scrollTo(0, 0); }
  $('#newScan').onclick = function () { resetAll(); openScan(); };
  $('#goHome').onclick = resetAll;
  $('#stay').onclick = function () { $('#done').classList.remove('on'); };
  $('#shareBtn').onclick = async function () {
    if (!state.pages.length) return;
    store('docscan_name', $('#fileName').value);
    var name = fileBase(), blob = makePdf(), file = new File([blob], name + '.pdf', { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); showDone('보냈어요'); }
      catch (e) { if (e && e.name === 'AbortError') return; toast('공유에 실패해 PDF를 저장합니다'); download(blob, name + '.pdf'); showDone('PDF를 저장했어요'); }
    } else { toast('이 브라우저는 공유를 지원하지 않아 PDF를 저장합니다'); download(blob, name + '.pdf'); showDone('PDF를 저장했어요'); }
  };
  $('#saveBtn').onclick = function () {
    if (!state.pages.length) return;
    store('docscan_name', $('#fileName').value);
    download(makePdf(), fileBase() + '.pdf');
    setTimeout(function () { showDone('PDF를 저장했어요'); }, 600);
  };
  $('#clearBtn').onclick = function () {
    if (state.pages.length && confirm('찍은 문서 ' + state.pages.length + '장을 지우고 처음 화면으로 갈까요?')) resetAll();
  };

  /* ---------- 시작 ---------- */
  try { var fx = JSON.parse(store('docscan_fix') || 'null'); if (fx) { state.fix.clean = fx.clean !== false; state.fix.straight = fx.straight !== false; } } catch (e) {}
  var sr = store('docscan_ratio'); if (sr === 'auto' || sr === 'a4' || sr === 'photo') state.ratio = sr;
  var saved = store('docscan_name');
  $('#fileName').value = saved ? saved.replace(/_\d{8}$/, '_' + today()) : '거래명세서_' + today();
  var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent) && !store('docscan_tip')) $('#installTip').style.display = '';
  $('#tipClose').onclick = function () { $('#installTip').style.display = 'none'; store('docscan_tip', '1'); };
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  render();
})();
</script>
</body>
</html>
